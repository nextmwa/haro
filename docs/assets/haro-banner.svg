<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Haro — Personal AI Desk Robot</title>
  <desc id="desc">Banner illustration of a ball-shaped robot inspired by Haro from the Gundam universe, next to the project title.</desc>

  <defs>
    <radialGradient id="space" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#12224a"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ee"/>
    </linearGradient>
    <radialGradient id="visor" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7fd9ff"/>
      <stop offset="55%" stop-color="#1f8fe0"/>
      <stop offset="100%" stop-color="#0a4f8c"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" fill="url(#space)"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="60" cy="34" r="1.6"/>
    <circle cx="140" cy="90" r="1.2"/>
    <circle cx="210" cy="40" r="1.8"/>
    <circle cx="40" cy="150" r="1.3"/>
    <circle cx="620" cy="28" r="1.6"/>
    <circle cx="700" cy="70" r="1.3"/>
    <circle cx="780" cy="30" r="1.8"/>
    <circle cx="840" cy="120" r="1.4"/>
    <circle cx="500" cy="20" r="1.2"/>
    <circle cx="330" cy="60" r="1.4"/>
  </g>

  <!-- Haro-inspired ball bot -->
  <g transform="translate(150,130)">
    <ellipse cx="0" cy="88" rx="72" ry="12" fill="#000000" opacity="0.35"/>

    <!-- ear fins -->
    <path d="M -78 -6 L -108 -20 L -100 8 Z" fill="#e2412c"/>
    <path d="M 78 -6 L 108 -20 L 100 8 Z" fill="#e2412c"/>

    <!-- body -->
    <circle cx="0" cy="0" r="78" fill="url(#shell)" stroke="#8a94a3" stroke-width="2"/>

    <!-- colour wedge (classic Haro patchwork panel) -->
    <path d="M -78 0 A 78 78 0 0 1 -19 -76 L -12 -8 Z" fill="#e2412c"/>
    <path d="M 19 -76 A 78 78 0 0 1 78 0 L 12 -8 Z" fill="#f6c945"/>
    <path d="M -78 0 A 78 78 0 0 0 -19 76 L -12 8 Z" fill="#2a6fe0"/>

    <!-- belt line -->
    <rect x="-78" y="-10" width="156" height="20" fill="#c7ced8"/>
    <rect x="-78" y="-3" width="156" height="6" fill="#8a94a3"/>

    <!-- eyes -->
    <circle cx="-24" cy="-4" r="15" fill="url(#visor)"/>
    <circle cx="24" cy="-4" r="15" fill="url(#visor)"/>
    <circle cx="-28" cy="-9" r="3.5" fill="#ffffff"/>
    <circle cx="20" cy="-9" r="3.5" fill="#ffffff"/>

    <!-- top antenna -->
    <line x1="0" y1="-78" x2="0" y2="-98" stroke="#8a94a3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-102" r="7" fill="#e2412c"/>
  </g>

  <!-- Title -->
  <g transform="translate(330,110)" font-family="Verdana, Geneva, sans-serif">
    <text x="0" y="0" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="4">HARO</text>
    <text x="4" y="34" font-size="18" fill="#7fd9ff" letter-spacing="1">PERSONAL AI DESK ROBOT</text>
    <text x="4" y="64" font-size="13" fill="#aab4c2">"Piku piku!" — companion unit, Universal Century-inspired</text>
  </g>
</svg>
