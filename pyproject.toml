[project]
name = "haro"
version = "0.1.0"
description = "Personal AI desk robot"
requires-python = ">=3.11,<3.12"
dependencies = [
    # tflite-runtime 2.14.0 (the last release, Oct 2023, and the newest
    # version that publishes any wheel at all -- see the Python-version note
    # below) is a compiled extension built against the NumPy 1.x ABI. Under
    # NumPy 2.x it fails at import with "_ARRAY_API not found" /
    # "numpy.core.multiarray failed to import". Cap below 2 until a newer
    # tflite-runtime (or its ai-edge-litert successor) is adopted.
    "numpy>=1.24.0,<2",
    "sounddevice>=0.4.6",
    "websockets>=12.0",
    "openwakeword>=0.6.0",
    "webrtcvad>=2.0.10",
    "luma.oled>=3.13.0",
    "Pillow>=10.0.0",
    "aiohttp>=3.9.0",
    # webrtcvad (unmaintained) does `import pkg_resources` at import time.
    # setuptools removed pkg_resources entirely in 82.0.0 (deprecated since
    # 67.5.0), so an unpinned setuptools install breaks this at runtime with
    # "ModuleNotFoundError: No module named 'pkg_resources'". Pin below that.
    "setuptools<82",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # webrtcvad (third-party) imports pkg_resources at import time.
    "ignore:pkg_resources is deprecated:UserWarning",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
