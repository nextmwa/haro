[project]
name = "haro"
version = "0.1.0"
description = "Personal AI desk robot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "websockets>=12.0",
    "openwakeword>=0.6.0",
    "webrtcvad>=2.0.10",
    "luma.oled>=3.13.0",
    "Pillow>=10.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # webrtcvad (third-party) imports pkg_resources at import time.
    "ignore:pkg_resources is deprecated:UserWarning",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
